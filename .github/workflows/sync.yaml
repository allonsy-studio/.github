name: Sync templates
on:
    push:
        branches: [main]
        paths: ["templates/**"]
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  token: ${{ steps.app-token.outputs.token }}
            - id: weaver
              uses: allonsy-studio/actions-weaver@d924f56d174278c884ccb3eb582764b7fb67e464 # v4
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  templates: templates
                  variables: '{"npm_org": "@allons-y"}'
            - run: echo '${{ steps.weaver.outputs.pull-requests }}'
